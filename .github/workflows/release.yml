# .github/workflows/release.yml
name: Build release binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: Upstream version to build (e.g. 1.0.2)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,      os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl,     os: ubuntu-latest }
          - { target: armv7-unknown-linux-musleabihf, os: ubuntu-latest }
          - { target: arm-unknown-linux-musleabihf,   os: ubuntu-latest }
          - { target: aarch64-apple-darwin,           os: macos-latest }
          - { target: x86_64-apple-darwin,            os: macos-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: jmmv/ssh-agent-switcher
          ref: ssh-agent-switcher-${{ inputs.version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
      - if: runner.os == 'Linux'
        run: |
          cargo install --locked cargo-zigbuild
          cargo zigbuild --release --locked --target ${{ matrix.target }}
      - if: runner.os == 'macOS'
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        env:
          COPYFILE_DISABLE: "1"  # keep macOS tar from adding AppleDouble ._ files
        run: |
          name="ssh-agent-switcher-${{ inputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/ssh-agent-switcher" \
             ssh-agent-switcher.1 COPYING "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: "*.tar.gz"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum *.tar.gz > SHA256SUMS
          gh release create "v${{ inputs.version }}" *.tar.gz SHA256SUMS \
            --repo "${{ github.repository }}" \
            --title "ssh-agent-switcher ${{ inputs.version }} (static musl builds)" \
            --notes "Unmodified upstream jmmv/ssh-agent-switcher ${{ inputs.version }}."
